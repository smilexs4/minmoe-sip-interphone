[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

;===========================================================
; Internal dialplan: 1001 (softphone) <-> 1002 (Minmoe terminal)
;===========================================================
[from-internal]
; Any 4-digit extension starting with 1 dials straight through.
; __DYNAMIC_FEATURES (double underscore = inherited) enables the "opendoor"
; feature (see features.conf) on the calling channel *and* propagates it to
; the outbound channel Dial() creates, so whichever side presses '*' can
; trigger it.
exten => _1XXX,1,NoOp(Internal call from ${CALLERID(num)} to ${EXTEN})
 same => n,Set(__DYNAMIC_FEATURES=opendoor)
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

;===========================================================
; Fallback door-open action, triggered by the '*' dynamic feature
; while a call is bridged. '#' is intentionally left alone here -
; it is not consumed by Asterisk, so it passes through untouched
; (RFC4733) to the Hikvision terminal, which interprets it itself
; using its own configured "open door on DTMF" setting.
;===========================================================
[open-door]
exten => s,1,NoOp(Opening door via Hikvision ISAPI HTTP relay)
 same => n,System(/usr/local/bin/open_door.sh)
 same => n,Return()
