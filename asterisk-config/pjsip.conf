;
; Minimal PJSIP config for two local extensions:
;   1001 = softphone (MicroSIP / Zoiper)
;   1002 = Hikvision Minmoe door station
;
; Both extensions REGISTER to Asterisk (dynamic contact), so this works
; whether the devices are on the same LAN or roam around it via DHCP.
;

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; If Asterisk and the phones are all on the same LAN this is enough.
; If you later put clients across NAT, set external_media_address /
; external_signaling_address / local_net here.

;===========================================================
; 1001 - Softphone (MicroSIP / Zoiper)
;===========================================================
[1001]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
allow=g722
auth=1001-auth
aors=1001
; Keep RTP flowing through Asterisk (not directly between phones).
; Required so Asterisk can see in-call DTMF and trigger the '*' feature.
direct_media=no
dtmf_mode=rfc4733
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=no

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=CHANGE_ME_1001

[1001]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

;===========================================================
; 1002 - Hikvision Minmoe door station
;===========================================================
[1002]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
allow=g722
auth=1002-auth
aors=1002
direct_media=no
dtmf_mode=rfc4733
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=no

[1002-auth]
type=auth
auth_type=userpass
username=1002
password=CHANGE_ME_1002

[1002]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30
