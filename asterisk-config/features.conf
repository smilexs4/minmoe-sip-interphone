[general]
featuredigittimeout=2000
; Move the built-in pickup feature off '*8' so nothing but our own
; "opendoor" feature starts with '*' - otherwise Asterisk waits the full
; featuredigittimeout after '*' to see if an '8' is coming next.
pickupexten=8500

[featuremap]
; Built-in features default to blindxfer=# and disconnect=* even with no
; [featuremap] section at all. Both would steal digits before our own
; logic (or the Hikvision terminal) ever sees them, so explicitly disable
; the ones we don't want.
blindxfer =>
disconnect =>
atxfer =>
automon =>
automixmon =>

[applicationmap]
; Either leg of the bridge pressing '*' runs the open-door dialplan
; context above, which fires the HTTP ISAPI request to the Hikvision
; terminal. This is the fallback path when the terminal's own in-band
; DTMF door-open (triggered by '#', configured on the device itself)
; isn't usable for some reason.
opendoor => *,self,Gosub(open-door,s,1)
